# Reusable malware / IOC guard for the Shai-Hulud worm family and the 2026
# VS Code auto-run variants that followed it.
# Invoked org-wide as a BLOCKING job of the central pr-security.yml pipeline
# (Approach C: org ruleset "require workflows to pass"). No per-repo caller stub.
# Runs in the TARGET repo's context, so its own checkout pulls the PR merge result.
#
# ── 2026-08-09 rewrite. Two coverage gaps closed ─────────────────────────────
# 1. EXTENSION SCOPE. The previous inline scan matched only
#    *.js/*.cjs/*.mjs/*.ts/*.tsx/*.jsx. This worm family ships its dropper as a
#    binary-looking asset (e.g. a `.woff2` font) and launches it from
#    `.vscode/tasks.json` — so neither the payload nor its launcher was ever
#    opened, even when the payload contained patterns the guard already knew.
#    An extension allowlist is the wrong shape for this threat; the scan now
#    reads every tracked text file and checks asset extensions by magic bytes.
#
# 2. DIFF VS TREE. This family also uses merge commits whose tree carries the
#    payload while both parents are clean, which any diff-based or
#    `--no-merges` scan steps over. Detection is now tree-based.
#
# Detection lives in scripts/tree-ioc-scan.sh so it can be tested and run
# locally, instead of being embedded in YAML where neither is possible.
name: shai-hulud-guard (reusable)

on:
  workflow_call:
    inputs:
      all-branches:
        # DEPRECATED and ignored since 2026-08-09. Kept declared so any existing
        # caller passing it does not fail. Per-branch sweeps are not a PR gate's
        # job -- a PR can only merge its own head -- and are handled separately by
        # the org-wide inventory tooling.
        description: "DEPRECATED — ignored. Use the org-wide bare-inventory scan for branch sweeps."
        required: false
        default: false
        type: boolean
      tooling-ref:
        # Ref of THIS repo to fetch the scanner from. Defaults to main, which is
        # what production uses. Exists so a PR that changes the scanner can point
        # at its own branch and actually exercise the new code in CI — otherwise
        # `uses: ...@main` means a change to this workflow is merged untested,
        # which is not acceptable for a gate that is required on every repo.
        description: Ref of workflow-security-pr-check to load the scanner from.
        required: false
        default: main
        type: string

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10   # bound the run so a hang can't wedge a required-check merge gate
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          # Full history is required: the false-positive allowlist is resolved
          # from the BASE commit, and `git show <base>:...` cannot reach it at
          # depth 1. At depth 1 the allowlist silently resolves to empty — which
          # fails in the SAFE direction (no suppressions) but would surface as
          # mystery blocks that nobody can switch off.
          fetch-depth: 0
          persist-credentials: false
      # Fetch the scanner from THIS repo (the central one) rather than the target
      # repo being scanned, whose head is untrusted PR content. Pinned to the
      # same ref this reusable workflow was called at.
      - name: Fetch scanner from the central repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          repository: AvantoDev/workflow-security-pr-check
          ref: ${{ inputs.tooling-ref }}
          path: .security-tooling
          persist-credentials: false

      # Resolve the false-positive allowlist from the BASE commit only, matching
      # the convention already used here for osv-scanner.toml and .gitleaks.toml.
      # A pull request must not be able to introduce a finding AND approve its own
      # suppression in the same change.
      - name: Resolve allowlist from base
        id: allow
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -uo pipefail
          out="${RUNNER_TEMP:-/tmp}/security-allowlist"
          : > "$out"
          if [ -n "${BASE_SHA:-}" ] && git show "$BASE_SHA:.security-allowlist" > "$out" 2>/dev/null; then
            echo "allowlist: using .security-allowlist from base commit ($(grep -cve '^\s*$' "$out") entr(y|ies))"
          else
            echo "allowlist: none on the base branch — scanning with no suppressions"
          fi
          echo "path=$out" >> "$GITHUB_OUTPUT"

      # TREE-based, not diff-based. This family uses evil merges: the payload
      # lives in the merge tree while both parents are clean, so any diff- or
      # --no-merges-based scan finds nothing. On `pull_request`, checkout gives us
      # the merge result, which is exactly what would land on the base branch.
      - name: Malware / IOC scan (tree-based)
        shell: bash
        env:
          ALLOWLIST: ${{ steps.allow.outputs.path }}
        run: |
          set -uo pipefail
          bash .security-tooling/scripts/tree-ioc-scan.sh --allowlist "$ALLOWLIST" .
          rc=$?
          # 0 clean · 1 confirmed indicator · 3 internal error. 3 must BLOCK — a
          # scanner that suppresses its own errors and still reports clean produces
          # a confident false all-clear, the worst outcome a security gate has.
          if [ "$rc" = "3" ]; then
            echo "::error::scanner failed internally — failing closed rather than passing unverified"
          fi
          exit "$rc"
